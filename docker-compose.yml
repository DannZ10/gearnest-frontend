# Frontend — run from gearnest-web/:  docker compose up --build
# The backend stack lives in ../gearnest-api/docker-compose.yml; start it first.
# NEXT_PUBLIC_API_URL is baked at build time and must be reachable from the
# browser, i.e. the API's host-published port (http://localhost:8000/api).
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
